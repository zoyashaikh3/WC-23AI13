<!DOCTYPE html>
<html>
<head>
    <title>College Facilities</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 50px;
            color: #1b5e20;
            text-shadow: 1px 1px 2px #a5d6a7;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 30px;
            width: 60%;
        }

        li {
            background-color: #ffffff;
            margin: 12px 0;
            padding: 15px 20px;
            border-left: 6px solid #2e7d32;
            border-radius: 10px;
            font-size: 18px;
            color: #2e7d32;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, background-color 0.3s;
        }

        li:hover {
            transform: translateX(8px);
            background-color: #c8e6c9;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #1b5e20;
            font-weight: bold;
            background: #a5d6a7;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

    <h1>College Facilities</h1>

    <ul>
        <li>Library</li>
        <li>Well Equipped Labs</li>
        <li>Canteen</li>
        <li>Sports Ground</li>
        <li>Wi-Fi Facilities</li>
        <li>Hostels and PGs Nearby</li>
    </ul>

    <a href="home.html">← Back to Home</a>

</body>
</html>
