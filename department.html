<!DOCTYPE html>
<html>
<head>
    <title>Our Departments</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 50px;
            color: #1b5e20;
            text-shadow: 1px 1px 2px #a5d6a7;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 14px 20px;
            text-align: left;
        }

        th {
            background-color: #2e7d32;
            color: white;
            font-size: 18px;
        }

        tr:nth-child(even) {
            background-color: #f1f8e9;
        }

        tr:nth-child(odd) {
            background-color: #ffffff;
        }

        tr:hover {
            background-color: #c8e6c9;
            transition: 0.3s;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #1b5e20;
            font-weight: bold;
            background: #a5d6a7;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background-color: #2e7d32;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Our Departments</h1>

    <table>
        <tr>
            <th>Department Name</th>
            <th>Head of Department</th>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>Dr. Tabrez Khan</td>
        </tr>
        <tr>
            <td>CSE Data Science Engineering</td>
            <td>Dr. Tabassum Maktum</td>
        </tr>
        <tr>
            <td>CSE AIML</td>
            <td>Dr. Salim G. Shaikh</td>
        </tr>
    </table>

    <a href="home.html">← Back to Home</a>

</body>
</html>
